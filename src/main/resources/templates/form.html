<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WP Exam</title>
</head>
<body>
<!-- The form should submit to ReservationsController.create or ReservationsController.update,
     depending on whether we are creating or editing a reservation -->
<form method="post" th:action="@{${reservation == null ? '/reservations' : '/reservations/' + reservation.id}}">
    <div>
        <label for="guestName">Guest Name</label>
        <input type="text"
               id="guestName"
               name="guestName"
               th:value="${reservation != null ? reservation.getGuestName() : ''}"


               required>
    </div>
    <div>
        <label for="dateCreated">Date of Creation</label>
        <input type="date"
               id="dateCreated"
               name="dateCreated"
               th:value="${reservation != null ? reservation.getDateCreated() : ''}"

               required>
    </div>
    <div>
        <label for="daysOfStay">Days of Stay</label>
        <input type="number"
               id="daysOfStay"
               name="daysOfStay"
               th:value="${reservation != null ? reservation.getDaysOfStay() : ''}"

               required>
    </div>
    <div>
        <label for="roomType">Room Type</label><br/>
        <select id="roomType" name="roomType" size="5">
            <!-- For each RoomType you should have one <option> like below  -->
<!--            <option>[roomType]</option>-->
            <option th:each="roomType : ${types}"
                    th:value="${roomType}"
                    th:text="${roomType}"
                    th:selected="${reservation != null && reservation.roomType == roomType}">            </option>
        </select>
    </div>
    <div>
        <label>Hotel</label><br/>
        <select id="hotel" name="hotelId"  size="5">
            <!-- For each hotel you should have one <option> like below  -->
<!--            <option>[hotel.name]</option>-->
            <option th:each="hotel : ${hotels}"
                    th:value="${hotel.getId()}"
                    th:text="${hotel.getName()}"
                    th:selected="${reservation != null && reservation.hotel!= null  && reservation.hotel.id == hotel.id}">
            </option>
        </select>
    </div>

    <button id="submit" type="submit">Submit</button>
    <a id="back" href="/reservations" type="button" class="btn btn-primary">Back to reservations</a>
</form>

<div>
    <ul id="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</div>

</body>
</html>
